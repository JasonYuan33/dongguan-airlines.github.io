<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东莞航空官网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f0e6ff;
            overflow-x: hidden;
        }
        .slide {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .slide img {
            width: 100%;
            height: auto;
            max-height: 100vh;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <div class="slide"><img src="1.png"></div>
    <div class="slide"><img src="2.png"></div>
    <div class="slide"><img src="3.png"></div>
    <div class="slide"><img src="4.png"></div>
    <div class="slide"><img src="5.png"></div>
    <div class="slide"><img src="6.png"></div>
</body>
</html>
