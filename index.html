<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东莞航空 Dongguan Airlines</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
        }
        /* 每个页面都是全屏背景图，和你跑通的原版逻辑完全一样 */
        .page {
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .page1 { background-image: url('1.png'); }
        .page2 { background-image: url('2.png'); }
        .page3 { background-image: url('3.png'); }
        .page4 { background-image: url('4.png'); }
        .page5 { background-image: url('5.png'); }
        .page6 { background-image: url('6.png'); }
    </style>
</head>
<body>
    <!-- 没有任何多余的文字、按钮，只保留背景图容器 -->
    <div class="page page1"></div>
    <div class="page page2"></div>
    <div class="page page3"></div>
    <div class="page page4"></div>
    <div class="page page5"></div>
    <div class="page page6"></div>
</body>
</html>
